name: Build

on:
  push:
    branches: [main]
    paths: ['**', '!**.md', '!docs/**', 'docs/*.html', '.github/release-notes.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build with MSVC (program and installer)
        shell: cmd
        run: .\build.bat setup ci

      # the archive gets the same runtime DLLs as the installer (staged and checked by build.bat setup):
      # the program starts on a clean Windows without the Visual C++ Redistributable
      - name: Package for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item atoms.exe, docs/MANUAL.html, docs/ИНСТРУКЦИЯ.html, LICENSE dist/
          Copy-Item .build/setup/vcomp140.dll, .build/setup/vcruntime140.dll, .build/setup/vcruntime140_1.dll dist/
          Compress-Archive dist/* atoms-windows-x64.zip
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: atoms-windows-x64
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: AtomsSetup
          path: AtomsSetup.exe

      # A new version in atoms.rc (ProductVersion) gets a new release.
      # Builds of the same version refresh that release: notes, archive, installer, and the tag moves to the built commit.
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path res/atoms.rc -Pattern '"ProductVersion",\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          $title = "Atoms $ver"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag atoms-windows-x64.zip AtomsSetup.exe --target $env:GITHUB_SHA --title $title --notes-file .github/release-notes.md
            exit $LASTEXITCODE
          }
          git tag -f $tag
          git push -f origin "refs/tags/$tag"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $tag --title $title --notes-file .github/release-notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload $tag atoms-windows-x64.zip AtomsSetup.exe --clobber
