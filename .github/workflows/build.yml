name: Build

on:
  push:
    branches: [main]
    paths: ['**', '!**.md', '!docs/**', '.github/release-notes.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build with MSVC
        shell: cmd
        run: .\build.bat release ci

      - name: Package for Windows
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $omp = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.OpenMP\vcomp140.dll" | Sort-Object FullName | Select-Object -Last 1
          if (-not $omp) { throw "vcomp140.dll not found in $vs" }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item atoms.exe, MANUAL.html, ИНСТРУКЦИЯ.html, LICENSE, $omp.FullName dist/
          Compress-Archive dist/* atoms-windows-x64.zip
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: atoms-windows-x64
          path: dist/

      # A new version in atoms.rc (ProductVersion) gets a new release.
      # Builds of the same version refresh that release: notes, archive, and the tag moves to the built commit.
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path atoms.rc -Pattern '"ProductVersion",\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          $title = "Atoms $ver"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag atoms-windows-x64.zip --target $env:GITHUB_SHA --title $title --notes-file .github/release-notes.md
            exit $LASTEXITCODE
          }
          git tag -f $tag
          git push -f origin "refs/tags/$tag"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $tag --title $title --notes-file .github/release-notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload $tag atoms-windows-x64.zip --clobber
